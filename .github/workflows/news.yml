# .github/workflows/news.yml
name: Score news sentiment

on:
  schedule:
    # Daily, 17:10 UTC -- 50 minutes before predict.yml's daily forecast
    # cron (18:00 UTC). Widened from an earlier 15-minute gap: this job
    # can run up to 29 sequential GDELT + LLM calls (with retry/backoff
    # on GDELT rate-limiting), so it needs real headroom, not the tight
    # gap that's fine for this repo's other single-purpose jobs.
    - cron: '10 17 * * *'
  workflow_dispatch:

jobs:
  score-news:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run news sentiment job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        run: python -m app.news.cli
